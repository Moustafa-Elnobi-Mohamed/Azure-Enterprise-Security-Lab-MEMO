<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">MEMO Foundation enterprise Azure security lifecycle</title>
  <desc id="desc">A portrait infographic showing the identity, protected platform, security operations, assurance, and decommissioning lifecycle of the MEMO Foundation project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.55" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27a8ff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48b9ff"/>
    </marker>
    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { font-size: 68px; font-weight: 700; letter-spacing: -1.5px; fill: #f5fbff; }
      .subtitle { font-size: 25px; font-weight: 400; fill: #b8d5e9; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; fill: #54c3ff; }
      .layer { font-size: 26px; font-weight: 700; fill: #f5fbff; }
      .body { font-size: 20px; font-weight: 400; fill: #c8deec; }
      .small { font-size: 17px; font-weight: 500; fill: #a9c6d9; }
      .metric { font-size: 42px; font-weight: 750; fill: #f5fbff; }
      .metric-label { font-size: 16px; font-weight: 600; fill: #b7d2e3; }
      .chip { font-size: 16px; font-weight: 700; fill: #dff4ff; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="240" fill="#0078d4" opacity="0.12"/>
  <circle cx="90" cy="1420" r="300" fill="#00b7c3" opacity="0.08"/>

  <g class="sans">
    <text x="72" y="82" class="eyebrow">AZURE ENTERPRISE SECURITY LAB</text>
    <text x="72" y="160" class="title">MEMO FOUNDATION</text>
    <text x="72" y="207" class="subtitle">Built. Secured. Monitored. Investigated. Validated. Safely removed.</text>

    <g transform="translate(72 255)" filter="url(#shadow)">
      <rect width="1056" height="168" rx="28" fill="#0d2b4a" stroke="#24577a" stroke-width="2"/>
      <rect width="11" height="168" rx="6" fill="url(#blue)"/>
      <text x="38" y="48" class="eyebrow">01  IDENTITY PLANE</text>
      <text x="38" y="88" class="layer">Human and non-human access</text>
      <text x="38" y="125" class="body">Entra users + groups  •  least-privilege RBAC  •  JIT access</text>
      <text x="38" y="153" class="body">managed identities  •  service accounts  •  no workload secrets</text>
      <g transform="translate(804 35)">
        <circle cx="72" cy="49" r="44" fill="#123e64" stroke="#48b9ff" stroke-width="3"/>
        <circle cx="72" cy="37" r="13" fill="none" stroke="#dff4ff" stroke-width="4"/>
        <path d="M45 78c4-20 17-29 27-29s23 9 27 29" fill="none" stroke="#dff4ff" stroke-width="4" stroke-linecap="round"/>
        <rect x="116" y="28" width="63" height="51" rx="9" fill="#123e64" stroke="#48b9ff" stroke-width="3"/>
        <path d="M133 52h29M147 40v24" stroke="#dff4ff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <path d="M600 423v38" stroke="#48b9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(72 478)" filter="url(#shadow)">
      <rect width="1056" height="180" rx="28" fill="#0d2b4a" stroke="#24577a" stroke-width="2"/>
      <rect width="11" height="180" rx="6" fill="#21b7a8"/>
      <text x="38" y="48" class="eyebrow">02  PROTECTED PLATFORM</text>
      <text x="38" y="88" class="layer">Network, secrets, and containers</text>
      <text x="38" y="125" class="body">VNet + NSGs  •  Key Vault RBAC  •  HTTPS-only Container Apps</text>
      <text x="38" y="153" class="body">non-root UID 101  •  read-only filesystem  •  default-deny design</text>
      <g transform="translate(875 38)">
        <path d="M55 0l55 20v42c0 37-23 65-55 80C23 127 0 99 0 62V20z" fill="#103f4c" stroke="#4bd2c1" stroke-width="3"/>
        <path d="M31 70l17 17 34-42" fill="none" stroke="#e4fffb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <path d="M600 658v38" stroke="#48b9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(72 713)" filter="url(#shadow)">
      <rect width="1056" height="180" rx="28" fill="#0d2b4a" stroke="#24577a" stroke-width="2"/>
      <rect width="11" height="180" rx="6" fill="#f3a83b"/>
      <text x="38" y="48" class="eyebrow">03  SECURITY OPERATIONS</text>
      <text x="38" y="88" class="layer">Telemetry to defensible decisions</text>
      <text x="38" y="125" class="body">Log Analytics + Sentinel  •  3 live rules  •  20+ detection artifacts</text>
      <text x="38" y="153" class="body">Incident 22  •  correlated evidence  •  BenignPositive closure</text>
      <g transform="translate(865 36)">
        <circle cx="65" cy="65" r="56" fill="#49351b" stroke="#ffc768" stroke-width="3"/>
        <path d="M32 73l22-21 18 18 29-33" fill="none" stroke="#fff1d3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="73" r="5" fill="#fff1d3"/><circle cx="54" cy="52" r="5" fill="#fff1d3"/><circle cx="72" cy="70" r="5" fill="#fff1d3"/><circle cx="101" cy="37" r="5" fill="#fff1d3"/>
      </g>
    </g>

    <path d="M600 893v38" stroke="#48b9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(72 948)" filter="url(#shadow)">
      <rect width="1056" height="180" rx="28" fill="#0d2b4a" stroke="#24577a" stroke-width="2"/>
      <rect width="11" height="180" rx="6" fill="#ac7cff"/>
      <text x="38" y="48" class="eyebrow">04  AUTOMATED ASSURANCE</text>
      <text x="38" y="88" class="layer">Security controls tested as code</text>
      <text x="38" y="125" class="body">Terraform + Bicep  •  Python validators  •  GitHub Actions</text>
      <text x="38" y="153" class="body">hardened Docker runtime  •  AI threat model  •  repository hygiene</text>
      <g transform="translate(862 43)">
        <rect x="0" y="0" width="130" height="94" rx="16" fill="#32254d" stroke="#c2a5ff" stroke-width="3"/>
        <path d="M27 30l20 17-20 17M59 66h39" fill="none" stroke="#f2ebff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <path d="M600 1128v38" stroke="#48b9ff" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(72 1183)" filter="url(#shadow)">
      <rect width="1056" height="126" rx="28" fill="#12364e" stroke="#4c93b9" stroke-width="2"/>
      <text x="38" y="46" class="eyebrow">05  CONTROLLED DECOMMISSION</text>
      <text x="38" y="84" class="layer">The evidence remains. The billable lab does not.</text>
      <text x="38" y="112" class="small">MEMO resources, monitoring, identities, applications, and RBAC removed after validation</text>
      <g transform="translate(936 25)">
        <circle cx="38" cy="38" r="36" fill="#144454" stroke="#62d8cb" stroke-width="3"/>
        <path d="M20 39l12 12 25-28" fill="none" stroke="#e5fffb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g transform="translate(72 1350)">
      <g>
        <text x="0" y="38" class="metric">10 / 0 / 2</text>
        <text x="0" y="66" class="metric-label">PASSED / FAILED / EXCEPTIONS</text>
      </g>
      <line x1="304" y1="0" x2="304" y2="78" stroke="#31516a" stroke-width="2"/>
      <g transform="translate(346 0)">
        <text x="0" y="38" class="metric">3</text>
        <text x="0" y="66" class="metric-label">LIVE SENTINEL RULES</text>
      </g>
      <line x1="550" y1="0" x2="550" y2="78" stroke="#31516a" stroke-width="2"/>
      <g transform="translate(591 0)">
        <text x="0" y="38" class="metric">24</text>
        <text x="0" y="66" class="metric-label">TERRAFORM FILES</text>
      </g>
      <line x1="785" y1="0" x2="785" y2="78" stroke="#31516a" stroke-width="2"/>
      <g transform="translate(827 0)">
        <text x="0" y="38" class="metric">12 + 12</text>
        <text x="0" y="66" class="metric-label">AI RISKS + RED-TEAM TESTS</text>
      </g>
    </g>

    <text x="72" y="1468" class="chip">LIVE + CI VALIDATED + HONESTLY BOUNDED</text>
    <text x="1128" y="1468" text-anchor="end" class="small">Moustafa Elnobi Mohamed</text>
  </g>
</svg>
