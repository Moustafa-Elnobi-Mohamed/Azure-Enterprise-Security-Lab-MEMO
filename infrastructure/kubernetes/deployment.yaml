apiVersion: apps/v1
kind: Deployment
metadata:
  name: memo-secure-app
  namespace: memo-app
  labels:
    app: memo-secure-app
    project: memo-foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memo-secure-app
  template:
    metadata:
      labels:
        app: memo-secure-app
        security-profile: restricted
    spec:
      serviceAccountName: memo-workload-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: memo-secure-app
          image: nginxinc/nginx-unprivileged:1.28.1-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: memo-app-config

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi