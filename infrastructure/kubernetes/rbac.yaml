apiVersion: v1
kind: ServiceAccount
metadata:
  name: memo-auditor-sa
  namespace: memo-app
  labels:
    purpose: security-auditing
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memo-namespace-reader
  namespace: memo-app
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memo-namespace-reader-binding
  namespace: memo-app
subjects:
  - kind: ServiceAccount
    name: memo-auditor-sa
    namespace: memo-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memo-namespace-reader