name: MEMO Security Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memo-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-assurance:
    name: Python Security Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python validators
        run: |
          python -m py_compile automation/python/memo_security_validator.py
          python -m py_compile automation/python/validate_repo_artifacts.py
          python -m py_compile automation/python/validate_ai_security_design.py
          python -m py_compile automation/python/validate_repository_hygiene.py

      - name: Validate sanitized Azure evidence
        run: python automation/python/memo_security_validator.py

      - name: Validate repository security artifacts
        run: python automation/python/validate_repo_artifacts.py

      - name: Validate design-only AI security controls
        run: python automation/python/validate_ai_security_design.py

      - name: Validate public repository hygiene
        run: python automation/python/validate_repository_hygiene.py

  infrastructure-as-code:
    name: Terraform and Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive automation/terraform

      - name: Initialize Terraform without backend
        run: |
          terraform \
            -chdir=automation/terraform/environments/lab \
            init \
            -backend=false \
            -input=false

      - name: Validate Terraform
        run: |
          terraform \
            -chdir=automation/terraform/environments/lab \
            validate

      - name: Install Bicep compiler
        run: az bicep install

      - name: Compile every Bicep deployment
        shell: bash
        run: |
          failures=0

          while IFS= read -r file; do
            echo "Validating $file"

            if ! az bicep build --file "$file" --stdout >/dev/null; then
              failures=$((failures + 1))
            fi
          done < <(
            find infrastructure/bicep \
              -type f \
              -name '*.bicep' \
              -print |
            sort
          )

          test "$failures" -eq 0

  hardened-container:
    name: Hardened Docker Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build secure container
        run: |
          docker build \
            --tag memo-secure-app:1.0.0 \
            infrastructure/containers/memo-secure-app

      - name: Start hardened container
        run: |
          docker run \
            --detach \
            --name memo-secure-app-test \
            --user 101:101 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 8080:8080 \
            memo-secure-app:1.0.0

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/healthz >/dev/null; then
              echo "Container is healthy."
              exit 0
            fi

            sleep 1
          done

          docker logs memo-secure-app-test
          exit 1

      - name: Verify response security headers
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            http://127.0.0.1:8080/ \
            > /tmp/memo-response-headers.txt

          grep -qi '^X-Content-Type-Options: nosniff' \
            /tmp/memo-response-headers.txt

          grep -qi '^X-Frame-Options: DENY' \
            /tmp/memo-response-headers.txt

          grep -qi '^Content-Security-Policy:' \
            /tmp/memo-response-headers.txt

      - name: Verify runtime hardening
        shell: bash
        run: |
          test "$(
            docker inspect \
              --format '{{.Config.User}}' \
              memo-secure-app-test
          )" = "101:101"

          test "$(
            docker inspect \
              --format '{{.HostConfig.ReadonlyRootfs}}' \
              memo-secure-app-test
          )" = "true"

          docker inspect \
            --format '{{json .HostConfig.CapDrop}}' \
            memo-secure-app-test |
          grep -q '"ALL"'

          docker inspect \
            --format '{{json .HostConfig.SecurityOpt}}' \
            memo-secure-app-test |
          grep -q 'no-new-privileges'

      - name: Remove test container
        if: always()
        run: docker rm --force memo-secure-app-test || true
